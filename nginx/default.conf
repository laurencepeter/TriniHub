server {
    listen       80;
    server_name  _;                       # matches any host / internal IP

    root   /usr/share/nginx/html;
    index  index.html;

    # Single-page-app fallback: Flutter web owns the routing, so any path that
    # is not a real file on disk must serve index.html rather than 404. Without
    # this, deep links, page refreshes on a route, and the Supabase auth
    # redirect (/#... callback) all break on a fresh nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the entrypoint files, so a new deploy is picked up immediately
    # instead of the browser holding a stale build that points at old assets.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Hashed build assets are safe to cache aggressively.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|woff2?|wasm|json)$ {
        try_files $uri /index.html;
        expires 7d;
        add_header Cache-Control "public";
    }
}
