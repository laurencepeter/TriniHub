services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - supabase_url
        - supabase_anon_key
    ports:
      - "8080:80"
    restart: unless-stopped

secrets:
  supabase_url:
    file: ./secrets/supabase_url
  supabase_anon_key:
    file: ./secrets/supabase_anon_key
